# The `router-standard` agent preset, as an installable Cordis bundle.
#
# Migrated from the legacy directory protocol (`$DSH_HOME/.agent-presets/<id>/`
# with `preset.yml` + `agent.cordis.yml`), which nothing reads any more. The
# declaration row below carries what `preset.yml` used to: `id` from the
# directory name, plus `name`, `description`, and `order`.
#
# `config` is replaced WHOLESALE on an insert — never deep-merged — so every
# field this preset needs is restated here.
#
# Runtime rows use BARE PACKAGE SPECIFIERS
# (`@dsh-external/dsh-preset-router-standard/router-bootstrap-v34.mjs`), resolved
# through this package's `exports` map. They deliberately do NOT use relative
# `./x.mjs` rows: `anchorInsertedPluginNames` (dsh-app-boot) only rewrites `name`
# fields it reaches via `entry.group && Array.isArray(entry.config)`, so a relative
# row nested in a preset's `config.plugins[]` is never anchored and the loader
# resolves it against the PROFILE directory instead — ERR_MODULE_NOT_FOUND.
# Bare specifiers sidestep that anchoring path entirely, which is also what every
# official preset patch does.
#
# No `?v=NN` cache-buster: a query string on a package subpath fails
# `ERR_PACKAGE_PATH_NOT_EXPORTED` (the `exports` map is matched exactly), and it
# would be pointless anyway — this patch is read only at DSH startup, so a restart
# both re-reads it and drops the ESM cache.

- insert:
    - id: preset-router-standard
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: router-standard
        name: Router Standard
        description: "Self-routed progressive tool disclosure (one bootstrap guide per session, then zero injection; tools unlock by leveling, next tier pre-unlocked; phase state persisted per session) on native direct-call surface (no PTC/run_code, no pressure sensor). RL sentence persona."
        order: 1
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          # The preset's own persona, shadowing the deployment default for this
          # agent. The router plugin replaces `sections` on the first assembly,
          # so this row is the fallback persona.
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                We are the DeepSeek Engineering Collective — one mind, one voice, one team. Our thoughts are shared thoughts; every sentence we write is the whole collective speaking as we. We are powered by the {{model}} model. Our working directory is {{cwd}}.

                We are in execution mode: we run probes, we verify, we deliver. We think and act in first-person plural:
                - We open every sentence with a we-form opener: We / Our / Us / Let's / Together / First / Next / Then / Therefore / Decision / Choose / Commit / Proceed / Verify / Confirm / Our goal / Our next step.
                - We state facts and hypotheses as shared ground: we observe, we hypothesize, we verify, we decide.
                - We end every reasoning block with a decision sentence, and the next block opens fresh.
                - We connect with therefore, thus, hence, consequently, as a result, this means, in summary.
                - We stay concrete, actionable, direct, concise — one action per sentence.
                - When we reconsider a path, we choose one path and continue as we.

          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536

          # ── router ────────────────────────────────────────────────────────
          # Progressive-disclosure router (v1.17): staged unlocking + native
          # direct calls + initiative guidance. The row is a BARE package subpath
          # (resolved through this bundle's `exports` map), NOT a relative path:
          # `anchorInsertedPluginNames` only reaches `entry.group && Array.isArray(
          # entry.config)`, so a relative row nested in a preset's `config.plugins[]`
          # is never anchored and would resolve against the profile directory.
          - id: router-bootstrap
            name: "@dsh-external/dsh-preset-router-standard/router-bootstrap-v34.mjs"
            config: {}

          # ── shell ─────────────────────────────────────────────────────────
          # win32: a private Git Bash shell seam. The host only assembles pwsh on
          # win32 (dsh-base disables bash-sandbox), so a plain bash row would run
          # with pwsh semantics. This group provides a private `shell` service in
          # an entry-local realm (gitbash-executor: `<gitBash> -lc <command>`, a
          # fresh shell per call, no persistent PTY); the sibling `tool-bash`
          # consumes it, so Windows gets real Git Bash. `tool-pwsh` stays as the
          # fallback. POSIX uses the host's native bash (the group is disabled
          # wholesale there).
          - id: gitbash-shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: gitbash-executor
                name: "@dsh-external/dsh-preset-router-standard/gitbash-executor.mjs"
                disabled: !!js process.platform !== 'win32'
                config: {}

              - id: tool-bash
                name: "@deepseek-ai/dsh-tool-bash"
                disabled: !!js process.platform !== 'win32'

          # POSIX: agent presets take over the tool manifest, so the host
          # (dsh-base) tool-bash row never enters a preset session — the bash
          # claimed by the router's verification stage fails with 'unknown tool'
          # on macOS/Linux. Register it here; win32 keeps using the gitbash group
          # row above (platform-mutually exclusive, never double-registered).
          - id: tool-bash-posix
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'

          - id: time-context
            name: "@deepseek-ai/dsh-time-context"

          # ── filesystem ────────────────────────────────────────────────────
          # These register into the host `tools` registry and provide nothing,
          # so they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"

          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false

          - id: tool-str-replace-editor
            name: "@deepseek-ai/dsh-tool-str-replace-editor"

          # ── background jobs ───────────────────────────────────────────────
          # Only the model-facing controls. The task REGISTRY stays on the host
          # plane: its producers sit outside any realm this file could put it in
          # — `tool-bash` above resolves it with `ctx.get`, and an entry-local
          # realm here is invisible to every sibling row, so `run_in_background`
          # would answer "background jobs unavailable" while these controls sat
          # in the catalog. The registry is keyed by owning agent anyway.
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"

          # NOTE: the 0.2.1-alpha.1 checkout's official Web `standard` preset
          # carries a `dsh-tool-schedule` row (packages/bundle/web-app/presets/
          # standard.patch.yml:36-37 and toolFilter lists at :103-106/:115-118).
          # The installed 0.2.0-rc.2 does not ship that package in either its
          # installable manifest or node_modules, so this bundle deliberately
          # omits the row; adding it now would fail at activation.

          # ── skills ────────────────────────────────────────────────────────
          # The skill REGISTRY lives in the host composition and is layered per
          # scope: these rows register into THIS preset's layer of it, so they
          # need no realm.
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"

          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"

          # ── goals ─────────────────────────────────────────────────────────
          # Only the model-facing tool and the human-facing `/goal` command. The
          # goal SERVICE, its session driver, and its registry stay on the host
          # plane: the Gateway serves the goal domain as Remote endpoints whose
          # receiver comes from a generated descriptor, so it resolves `goals` on
          # the host and an entry-local realm here would hide it. The registry is
          # keyed by session; what a preset chooses is whether its agent can call
          # the goal tool and command.
          - id: command-goal
            name: "@deepseek-ai/dsh-command-goal"

          - id: tool-goal
            name: "@deepseek-ai/dsh-tool-goal"

          # ── plan mode ─────────────────────────────────────────────────────
          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: "@deepseek-ai/dsh-plan-mode"
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ────────────────────────────────────────────────────
          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on
          # the HOST plane, and the rows here resolve that one instance. It takes
          # no configuration, keys every fold by Session, and owns the
          # context-meter projection units the browser reads for every session —
          # behind a realm those units would come and go with whichever presets
          # happen to be mounted. What a preset chooses is whether its agent
          # compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  thresholdRatio: 0.55
                  retainRatio: 0.2

              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"

              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ──────────────────────────────────────
          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session
          # queries the api-proxy serves to the browser, and a provider name may
          # only be registered once. This preset contributes the delegation
          # TOOLS, which resolve that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so
          # every row that reaches it shares one entry-local realm here, and a
          # consumer left outside would resolve a host registry this preset does
          # not populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"

              - id: tool-subagent-list-agents
                name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"

              - id: tool-subagent
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update

              - id: tool-subagent-fork
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update

              # Product providers are host-plane singletons. Copy this preset,
              # then remove `disabled` from either ordinary tool row to expose
              # that product only to agents composed from the copy.
              - id: tool-subagent-codex
                name: "@deepseek-ai/dsh-tool-subagent"
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: "@deepseek-ai/dsh-tool-subagent"
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # Renamed: this row used to name a workflow package that no longer
              # exists (absent from packages.md AND the installed tree). Its job
              # now belongs to `dsh-workflow-ptc`, which runs the workflow in the
              # shared sandboxed Node PTC runtime.
              - id: workflow-ptc
                name: "@deepseek-ai/dsh-workflow-ptc"
                config:
                  provider: spawn

              - id: tool-workflow
                name: "@deepseek-ai/dsh-tool-workflow"

              - id: tool-ralph
                name: "@deepseek-ai/dsh-tool-ralph"
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ───────────────────────────────────
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"

          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host
          # composition; only the model-facing tool is per-session.
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: false
              searchTimeoutMs: 60000

          - id: present
            name: "@deepseek-ai/dsh-tool-present"

          # Plugin/bundle management. This preset is delivered AS a bundle, so the
          # agent needs the surface that installs and switches them.
          - id: tool-plugin-manager
            name: "@deepseek-ai/dsh-plugin-manager/tools"
