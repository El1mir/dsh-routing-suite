# The `router-react` (experimental) agent preset, as an installable Cordis bundle.
#
# Migrated from the legacy directory protocol (`$DSH_HOME/.agent-presets/<id>/`
# with `preset.yml` + `agent.cordis.yml`), which nothing reads any more. The
# declaration row below carries what `preset.yml` used to: `id` from the
# directory name, plus `name` and `description`.
#
# `config` is replaced WHOLESALE on an insert — never deep-merged — so every
# field this preset needs is restated here.
#
# `order` is deliberately ABSENT: the legacy `preset.yml` declared none, and this
# is an experimental preset whose position in the picker is not load-bearing.
# Adding a number here would invent an ordering decision the preset never made.
#
# The runtime row uses a BARE PACKAGE SPECIFIER
# (`@dsh-external/dsh-preset-router-react/router-bootstrap-v17.mjs`), resolved
# through this package's `exports` map. A relative `./x.mjs` row would NOT work
# here: `anchorInsertedPluginNames` (dsh-app-boot) only rewrites `name` fields
# reached via `entry.group && Array.isArray(entry.config)`, so a relative row
# nested in a preset's `config.plugins[]` is never anchored and resolves against
# the PROFILE directory — ERR_MODULE_NOT_FOUND. Bare specifiers sidestep that path
# entirely, which is what every official preset patch does. No `?v=NN`
# cache-buster: a query on a package subpath fails
# `ERR_PACKAGE_PATH_NOT_EXPORTED`, and this patch is read only at startup anyway.
#
# The plugin list below is transcribed from THIS preset's own `agent.cordis.yml`,
# row for row — not from `router-standard`'s list.

- insert:
    - id: preset-router-react
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: router-react
        name: Router React (experimental)
        description: "Task-aware routing — RL-interface restoration (think-act loops): first request = one RL sentence + shell/editor surface. Full Standard tools after the first tool call."
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          # The router plugin replaces `sections` and clears `contexts` on the
          # first assembly, so this row is the fallback persona only.
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a helpful software engineer assistant.

          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536

          # ── router ────────────────────────────────────────────────────────
          # Task-aware reasoning-mode router: classifies the first user message
          # and injects the matching persona + first-turn core tool set; after
          # the first durable tool/call, exposes the full Standard catalog.
          #
          # routerMode:
          #   standard (default) — RL 接口还原: first request carries ONLY the RL
          #     training sentence + shell/str_replace_editor; the model works in
          #     think-act feedback loops.
          #   spec — 深度思考优先: classified persona + full prompt sections; the
          #     long first-turn reasoning chain is a feature, not a defect.
          - id: router-bootstrap
            name: "@dsh-external/dsh-preset-router-react/router-bootstrap-v17.mjs"
            config:
              routerMode: standard

          # ── shell ─────────────────────────────────────────────────────────
          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts`
          # injects it to publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row
          # that injects a service is the criterion for host-plane ownership —
          # injection resolves before any session exists, so there is no agent to
          # key by. Both shell tools consume the host registry from here; their
          # executors stay host-plane too.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ────────────────────────────────────────────────────
          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"

          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false

          # ── RL-shape editor ───────────────────────────────────────────────
          # The RL training interface uses persistent bash + str_replace_editor.
          # The weak band's first-turn core tool set is shell + this editor — the
          # RL shape — because the measured interface-restoration result is 100%
          # tool calls at 18–29K reasoning chars vs ~25% action / 73–101K under
          # the read/write/edit surface. The editor is only visible in the first
          # turn of a weak-band session; after the first durable tool/call the
          # full catalog opens.
          - id: tool-str-replace-editor
            name: "@deepseek-ai/dsh-tool-str-replace-editor"

          # ── background jobs ───────────────────────────────────────────────
          # Only the model-facing controls. The task REGISTRY stays on the host
          # plane: its producers sit outside any realm this file could put it in,
          # and an entry-local realm here is invisible to every sibling row, so
          # `run_in_background` would answer "background jobs unavailable" while
          # these controls sat in the catalog. The registry is keyed by owning
          # agent anyway. What a preset chooses is whether its agent can collect
          # and stop background work at all.
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"

          # ── skills ────────────────────────────────────────────────────────
          # The skill REGISTRY lives in the host composition and is layered per
          # scope: these rows register into THIS preset's layer of it, so they
          # need no realm.
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"

          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"

          # ── goals ─────────────────────────────────────────────────────────
          # Only the model-facing tool. The goal SERVICE, its session driver, and
          # the `/goal` command stay on the host plane: the Gateway serves the
          # goal domain as Remote endpoints whose receiver comes from a generated
          # descriptor, so it resolves `goals` on the host and an entry-local
          # realm here would hide it. The registry is keyed by session; what a
          # preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: "@deepseek-ai/dsh-tool-goal"

          # ── plan mode ─────────────────────────────────────────────────────
          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: "@deepseek-ai/dsh-plan-mode"
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ────────────────────────────────────────────────────
          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on
          # the HOST plane, and the rows here resolve that one instance.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"

              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"

              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ──────────────────────────────────────
          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session
          # queries the api-proxy serves to the browser, and a provider name may
          # only be registered once. This preset contributes the delegation
          # TOOLS, which resolve that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so
          # every row that reaches it shares one entry-local realm here.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"

              - id: tool-subagent-list-agents
                name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"

              - id: tool-subagent
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset,
              # then remove `disabled` from either ordinary tool row to expose
              # that product only to agents composed from the copy.
              - id: tool-subagent-codex
                name: "@deepseek-ai/dsh-tool-subagent"
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: "@deepseek-ai/dsh-tool-subagent"
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # Renamed: this row used to name a workflow package that no longer
              # exists (absent from packages.md AND the installed tree). Its job
              # now belongs to `dsh-workflow-ptc`.
              - id: workflow-ptc
                name: "@deepseek-ai/dsh-workflow-ptc"
                config:
                  provider: spawn

              - id: tool-workflow
                name: "@deepseek-ai/dsh-tool-workflow"

              - id: tool-ralph
                name: "@deepseek-ai/dsh-tool-ralph"
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ───────────────────────────────────
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"

          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host
          # composition; only the model-facing tool is per-session.
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: false
              searchTimeoutMs: 60000
