# dsh-routing-suite bundle patch
#
# 分发入口：插入 dsh-super-injector 引导器插件行。
# 引导器是唯一需要官方装配的入口；它注入的超级模组全部走运行时注入（免重启）。
#
# 注：三个 router preset 已迁移为 bundle 包（preset/router-*/bundle/），由各自
# package.json 的 dsh.bundle.patch 声明加载，不再使用 .agent-presets/ 目录协议。
# 本文件只负责插入引导器；router preset 的安装说明见 preset/README.md。
- insert:
    - id: dsh-super-injector
      name: '@dsh-external/dsh-super-injector'
      config: {}
